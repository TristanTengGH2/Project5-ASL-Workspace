<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handshape · tracking spike</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="stage" id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>

      <header class="top-overlay">
        <h1>Handshape <small>tracking spike</small></h1>
        <p>Webcam tracking test · Video stays in your browser</p>
      </header>

      <p id="status" class="status-overlay" role="status" aria-live="polite">Camera is off.</p>

      <div class="camera-control">
        <button id="toggle-camera" type="button">Start camera</button>
      </div>

      <section class="control-dock" aria-label="Tracking controls and diagnostics">
        <div class="controls">
        <label><input id="mirror" type="checkbox" checked /> Mirror preview</label>
        <label><input id="use-pose" type="checkbox" /> Add body points (pose)</label>
        <label><input id="show-labels" type="checkbox" /> Show landmark names</label>
        </div>
        <dl class="stats">
          <div><dt>FPS</dt><dd id="fps">–</dd></div>
          <div><dt>Tracking</dt><dd><span id="latency">–</span> ms</dd></div>
          <div class="hands-stat"><dt>Hands</dt><dd id="hands">–</dd></div>
        </dl>
        <p class="check-note">
          Raise your right hand: its box should say Right, even when mirrored.
        </p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
