<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handshape · tracking spike</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Handshape <small>tracking spike</small></h1>
      <p class="note">
        Technical test of webcam hand tracking. This page does not recognize signs.
        Video stays in your browser.
      </p>

      <div class="controls">
        <button id="toggle-camera" type="button">Start camera</button>
        <label><input id="mirror" type="checkbox" checked /> Mirror preview</label>
        <label><input id="use-pose" type="checkbox" /> Add body points (pose)</label>
      </div>

      <div class="stage" id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>

      <p id="status" role="status" aria-live="polite">Camera is off.</p>
      <dl class="stats">
        <dt>Frames processed / s</dt><dd id="fps">–</dd>
        <dt>Avg tracking time (ms)</dt><dd id="latency">–</dd>
        <dt>Hands</dt><dd id="hands">–</dd>
      </dl>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
